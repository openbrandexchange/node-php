; PHP settings for hosts running PHP-FPM / FastCGI (read automatically from this folder).
upload_max_filesize = 512M
post_max_size = 520M
memory_limit = 512M
max_execution_time = 300
; The portal parses uploads itself (repeated image fields, no file-count cap).
enable_post_data_reading = Off
; Errors go to the host's error log, never to visitors.
display_errors = Off
log_errors = On
expose_php = Off

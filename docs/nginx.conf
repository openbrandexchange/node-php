# nginx + PHP-FPM example for the Open Brand Exchange portal.
# The document root is the release's public/ folder; everything else stays private.
server {
    listen 443 ssl http2;
    server_name brands.example.com;
    root /var/www/obx-portal/public;
    index index.php;

    # ssl_certificate /etc/letsencrypt/live/brands.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/brands.example.com/privkey.pem;

    client_max_body_size 520m;
    client_body_timeout 300s;

    # Hidden files are never served, except /.well-known (the portal's discovery address).
    location ~ /\.(?!well-known/) { deny all; }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        # The portal parses uploads itself (repeated image fields, no file-count cap).
        fastcgi_param PHP_VALUE "enable_post_data_reading=Off
upload_max_filesize=512M
post_max_size=520M
memory_limit=512M
max_execution_time=300";
        fastcgi_read_timeout 300s;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    # No other PHP file is executable.
    location ~ \.php$ { return 404; }
}

# Background work: add to the crontab of the web server user
#   * * * * * php /var/www/obx-portal/bin/obx cron >/dev/null 2>&1

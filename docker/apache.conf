# Open Brand Exchange portal: Apache settings for the container.
<Directory /var/www/html/public>
  AllowOverride All
  Require all granted
</Directory>
ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off
# Requests and uploads: generous for 500 MB image zips, bounded for everything else.
Timeout 300
LimitRequestBody 545259520
# Workers: each can use up to memory_limit (512 MB) while rendering; size to the container.
<IfModule mpm_prefork_module>
  StartServers 2
  MinSpareServers 2
  MaxSpareServers 6
  MaxRequestWorkers ${OBX_APACHE_WORKERS}
  MaxConnectionsPerChild 1000
</IfModule>
# docker stop: finish running requests for up to 25 seconds.
GracefulShutdownTimeout 25
# Errors go to stderr (the image links error.log there); requests are logged by PHP as JSON.

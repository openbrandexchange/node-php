; Open Brand Exchange portal: PHP settings for the container (on top of php.ini-production).
upload_max_filesize = 512M
post_max_size = 520M
memory_limit = 512M
max_execution_time = 300
max_input_time = 300
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
opcache.enable = 1
opcache.validate_timestamps = 0
; The portal parses uploads itself (repeated image fields, no file-count cap).
enable_post_data_reading = Off
session.use_strict_mode = 1
default_socket_timeout = 30

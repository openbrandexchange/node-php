name: Idea or wish
description: Something the portal should do, or do better
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve, and for whom (brand, retailer, host)?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
  - type: textarea
    id: alternatives
    attributes:
      label: How do you solve it today?

# Release: runs only when a maintainer pushes a version tag (vX.Y.Z). Nothing is published by
# pushing to main.
#   - the release zip for web hosting (FTP upload): vendor/ and the web interface included,
#     with SHA256SUMS, an SPDX and a CycloneDX SBOM and build provenance, as a draft GitHub
#     release whose notes are the CHANGELOG.md entry of the version;
#   - Docker: ghcr.io/openbrandexchange/node-php:<version>, :<major>.<minor> and :latest
#     (not for pre-releases) for linux/amd64 and linux/arm64, with SBOM and provenance.
# The tag must match Config::VERSION in src/Config.php. See docs/operations.md#releases.
name: Release
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  zip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - name: The tag matches the version in the code
        run: |
          code=$(sed -n "s/.*public const VERSION = '\([^']*\)'.*/\1/p" src/Config.php)
          test "v$code" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, code $code" >&2; exit 1; }
      - name: Release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on {print}' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md" || { echo "CHANGELOG.md has no entry for $v" >&2; exit 1; }
      - name: Build the release zip
        run: |
          ./scripts/build-release.sh
          unzip -q "build/obx-portal-php-${GITHUB_REF_NAME#v}.zip" -d build/stage-sbom
      - uses: anchore/sbom-action@v0.24.2
        with:
          path: build/stage-sbom
          format: spdx-json
          output-file: build/obx-portal-php-${{ github.ref_name }}.spdx.json
          upload-artifact: false
      - uses: anchore/sbom-action@v0.24.2
        with:
          path: build/stage-sbom
          format: cyclonedx-json
          output-file: build/obx-portal-php-${{ github.ref_name }}.cdx.json
          upload-artifact: false
      - name: Checksums
        run: |
          cd build
          mv "obx-portal-php-${GITHUB_REF_NAME#v}.zip" "obx-portal-php-${GITHUB_REF_NAME}.zip"
          sha256sum obx-portal-php-* > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: build/obx-portal-php-${{ github.ref_name }}.zip
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: ${{ runner.temp }}/notes.md
          files: |
            build/obx-portal-php-${{ github.ref_name }}.zip
            build/obx-portal-php-${{ github.ref_name }}.spdx.json
            build/obx-portal-php-${{ github.ref_name }}.cdx.json
            build/SHA256SUMS

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/openbrandexchange/node-php
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          sbom: true
          provenance: mode=max
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/openbrandexchange/node-php
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
